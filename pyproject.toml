[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huntforge"
version = "0.5.0"
description = "HuntForge — endpoint threat-hunting and Windows forensics platform: ingest endpoint telemetry, normalize into a common evidence model, reconstruct timelines, hunt with explainable detections."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pouya Shini Karim"}]
keywords = ["cybersecurity", "dfir", "threat-hunting", "forensics", "windows", "cli", "blue-team", "defensive-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/REV3R5ED/HuntForge"
Issues = "https://github.com/REV3R5ED/HuntForge/issues"
Changelog = "https://github.com/REV3R5ED/HuntForge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
huntforge = "huntforge.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=huntforge --cov-report=term-missing"

[tool.coverage.run]
source = ["huntforge"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise AssertionError",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# line-length is inherited from [tool.ruff]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
