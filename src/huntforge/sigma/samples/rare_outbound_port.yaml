# Sample Sigma YAML rule (HuntForge subset): outbound connection to a rare
# external port. Written in real Sigma YAML shape; parsed by HuntForge's
# minimal YAML-subset parser (flat key: value shapes only).
title: Outbound Connection To Rare External Port
id: hf-sigma-0004
description: Detects outbound connections on ports outside the common-service list. A pivot lead, not proof.
author: HuntForge
date: 2026/10/03
status: experimental
logsource:
  product: windows
  category: network_connection
detection:
  selection:
    DestinationPort:
      - 4444
      - 8444
      - 1337
      - 31337
  condition: selection
falsepositives:
  - Custom business applications on fixed ports
  - Remote-access tools and gaming
level: low
tags:
  - attack.command_and_control
  - attack.t1571
